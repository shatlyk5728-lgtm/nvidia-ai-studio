name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall -q main.py
          python -c "import PySide6, openai, keyring; print('Dependencies imported successfully')"

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "NVIDIA AI Studio" --collect-all keyring --hidden-import keyring.backends.Windows main.py
          if (-not (Test-Path "dist/NVIDIA AI Studio.exe")) {
            Write-Error "PyInstaller did not create the expected EXE."
            Get-ChildItem -Recurse dist -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Item "dist/NVIDIA AI Studio.exe" | Format-List Name,Length,FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NVIDIA-AI-Studio-Windows
          path: "dist/NVIDIA AI Studio.exe"
          if-no-files-found: error
          retention-days: 30
